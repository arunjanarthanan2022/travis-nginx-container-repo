name: Scan Docker Image with Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx (optional for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Build the Docker Image from the Dockerfile
      - name: Build Docker Image
        run: |
          docker build -t nginx-container-repo:latest .

      # Step 4: Install Trivy (vulnerability scanner)
      - name: Install Trivy
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.1/trivy_0.58.1_Linux-64bit.deb -o trivy.deb
          sudo dpkg -i trivy.deb

      # Step 5: Scan Docker Image with Trivy and generate CSV report
      - name: Scan Docker Image with Trivy and generate CSV report
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --format table --no-progress nginx-container-repo:latest > trivy-report.txt
          
      # Step 6: Upload the Trivy CSV report as an artifact (using latest version of upload-artifact)
      - name: Upload Trivy CSV Report as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.csv
